name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Ping to Supabase
        run: |
          RAW_URL="${{ secrets.SUPABASE_URL }}"
          CLEAN_URL="${RAW_URL%/}"
          
          # 加上 -f 参数，如果不是 200/2xx 响应，curl 会直接报错标红，便于真实验证
          curl -f -i -X GET "${CLEAN_URL}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"