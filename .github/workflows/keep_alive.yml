name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Ping to Supabase
        run: |
          RAW_URL="${{ secrets.SUPABASE_URL }}"
          CLEAN_URL="${RAW_URL%/}"
          
          # 直接 Ping 健康检查接口，绕过 API Key 鉴权，100% 返回 200 OK
          curl -f -i -X GET "${CLEAN_URL}/health"